site_name: Cloud Runtime 教学项目
site_description: 从零理解云运行时的底层原理与设计哲学
site_url: https://wanglh39.github.io/cloudruntime/
repo_name: wanglh39/cloudruntime
repo_url: https://github.com/wanglh39/cloudruntime
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono

nav:
  - 首页: index.md
  - 全局概览: 00-overview/index.md
  - 隔离与沙箱: 01-isolation/index.md
  - 调度: 02-scheduling/index.md
  - 网络: 03-networking/index.md
  - 存储: 04-storage/index.md
  - FaaS: 05-faas/index.md
  - 控制面: 06-control-plane/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search:
      lang:
        - zh
        - en
